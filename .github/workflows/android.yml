name: Android MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tire-receiving-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

  signed-build:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    env:
      TIRE_RELEASE_STORE_PASSWORD: ${{ secrets.TIRE_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed release signing key
        env:
          TIRE_RELEASE_KEYSTORE_BASE64: ${{ secrets.TIRE_RELEASE_KEYSTORE_BASE64 }}
        run: bash .github/scripts/prepare-signing.sh
      - name: Android release build and lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify fixed signing identity
        run: bash .github/scripts/verify-signature.sh app/build/outputs/apk/release/app-release.apk
      - name: Name APK and checksum
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk dist-release/Tire-Receiving-0.1.1-preview.apk
          cp .github/release-certificate.sha256 dist-release/SIGNING-CERT-SHA256.txt
          cd dist-release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Tire-Receiving-0.1.1-preview
          path: dist-release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-release.html
      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "${TIRE_RELEASE_STORE_FILE:-}" ]; then rm -f -- "$TIRE_RELEASE_STORE_FILE"; fi
