name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag
        required: true
        default: v0.1.3-mvp
      apk_name:
        description: Release APK filename
        required: true
        default: Tire-Receiving-0.1.3-preview.apk
      apk_sha256:
        description: Expected lowercase APK SHA-256
        required: true
      apk_base64:
        description: Base64-encoded signed APK
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APK_NAME: ${{ inputs.apk_name }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      APK_BASE64: ${{ inputs.apk_base64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify signed release files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]
          [[ "$APK_NAME" =~ ^[0-9A-Za-z._-]+\.apk$ ]]
          [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p dist-release
          printf '%s' "$APK_BASE64" | base64 --decode > "dist-release/$APK_NAME"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > dist-release/SHA256SUMS.txt
          cp .github/release-certificate.sha256 dist-release/SIGNING-CERT-SHA256.txt
          cd dist-release
          sha256sum --check SHA256SUMS.txt
      - name: Upload files to the existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist-release/* --repo "$GITHUB_REPOSITORY" --clobber
